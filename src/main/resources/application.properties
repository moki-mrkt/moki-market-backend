spring.application.name=moki_market_backend

server.servlet.context-path=/v1/api

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

springdoc.api-docs.version=openapi_3_0

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

spring.data.web.pageable.serialization-mode=via-dto

spring.jpa.properties.hibernate.default_batch_fetch_size=100

spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

s3.url=${AWS_S3_ENDPOINT}
s3.accessKey=${AWS_ACCESS_KEY_ID}
s3.secretKey=${AWS_SECRET_ACCESS_KEY}
s3.bucket=${AWS_S3_BUCKET_NAME}
s3.region=us-east-1

s3.public_url=${AWS_S3_PUBLIC_URL}

cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://moki.com.ua,http://89.167.37.202

jwt.refresh-secret=${REFRESH_SECRET}
jwt.secret=${JWT_SECRET}

jwt.access.ttl=10m
jwt.refresh.ttl=2d

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

bot.name=${BOT_NAME}
bot.key=${BOT_KEY}
bot.chat.id=${BOT_CHAT_ID}

management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

