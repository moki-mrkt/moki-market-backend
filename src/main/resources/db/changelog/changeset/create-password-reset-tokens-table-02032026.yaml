databaseChangeLog:
  - changeSet:
      id: create-password-reset-tokens
      author: KyryloPyvovarov
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_password_reset_to_users
                    references: users(id)
              - column:
                  name: expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: used
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
  - changeSet:
      id: drop-used-column-from-password-reset-token-table
      author: KyryloPyvovarov
      changes:
        - dropColumn:
            tableName: password_reset_tokens
            columnName: used