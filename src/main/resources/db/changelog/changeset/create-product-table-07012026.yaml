databaseChangeLog:
  - changeSet:
      id: create-product-table
      author: KyryloPyvovarov
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: products
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: product_category
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: rating
                  type: NUMERIC(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: availability
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: discount
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: purchase_price
                  type: NUMERIC(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: manufacturer_of_the_product
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: subcategory
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: sales_count
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: init_of_measure
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: value_of_init_of_measure
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: creation_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: characteristics
                  type: jsonb
                  defaultValue: "{}"
                  constraints:
                    nullable: false
  - changeSet:
      id: add-version-column-to-products
      author: KyryloPyvovarov
      preConditions:
        - onFail: MARK_RAN
          not:
            - columnExists:
                tableName: products
                columnName: version
      changes:
        - addColumn:
            tableName: products
            columns:
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: '0'
                  constraints:
                    nullable: false
  - changeSet:
      id: add-reviews-count-column-to-products
      author: KyryloPyvovarov
      preConditions:
        - onFail: MARK_RAN
          not:
            - columnExists:
                tableName: products
                columnName: reviews_count
      changes:
        - addColumn:
            tableName: products
            columns:
              - column:
                  name: reviews_count
                  type: BIGINT
                  defaultValueNumeric: '0'
                  constraints:
                    nullable: false
  - changeSet:
      id: add-price-with-discount-column
      author: You
      changes:
        - addColumn:
            tableName: products
            columns:
              - column:
                  name: price_with_discount
                  type: NUMERIC(19, 2)
        - sql:
            sql: "UPDATE products SET price_with_discount = price - (price * discount / 100.0)"
        - addNotNullConstraint:
            tableName: products
            columnName: price_with_discount
            columnDataType: NUMERIC(19, 2)
  - changeSet:
      id: update-size-for-name-of-product
      author: KyryloPyvovarov
      changes:
        - modifyDataType:
            tableName: products
            columnName: name
            newDataType: VARCHAR(64)