databaseChangeLog:
  - changeSet:
      id: create-cart-table
      author: KyryloPyvovarov
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: carts
      changes:
        - createTable:
            tableName: carts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_carts_user_id
                    references: users(id)
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE

        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: cart_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_cart_items_cart_id
                    references: carts(id)
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_cart_items_product_id
                    references: products(id)
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false