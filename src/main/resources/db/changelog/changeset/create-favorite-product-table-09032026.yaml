databaseChangeLog:
  - changeSet:
      id: create-feedbacks-table
      author: KyryloPyvovarov
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: favorite_product
      changes:
        - createTable:
            tableName: favorite_product
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fav_user
                    references: users(id)
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fav_product
                    references: products(id)
              - column:
                  name: creation_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
