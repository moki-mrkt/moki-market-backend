databaseChangeLog:
  - changeSet:
      id: create-activation-tokens-table
      author: KyryloPyvovarov
      changes:
        - createTable:
            tableName: activation_tokens
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: used
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: activation_tokens
            baseColumnNames: user_id
            constraintName: fk_activation_token_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
  - changeSet:
      id: drop-used-column-from-activation-token-table
      author: KyryloPyvovarov
      changes:
        - dropColumn:
            tableName: activation_tokens
            columnName: used
  - changeSet:
      id: update-id-type
      author: KyryloPyvovarov
      changes:
        - modifyDataType:
            tableName: activation_tokens
            columnName: id
            newDataType: UUID