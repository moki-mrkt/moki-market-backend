version: '3.8'

services:

  postgresql-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: moki_db
    ports:
      - "15432:5432"
    volumes:
      - ./infrastructure/db/create_db.sql:/docker-entrypoint-initdb.d/create_db.sql
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    container_name: pg_admin
    image: dpage/pgadmin4:7
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  minio:
    image: minio/minio:latest
    container_name: moki-minio
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Web Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "

      until /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; do
        echo 'MinIO is not ready yet... waiting 1 sec';
        sleep 1;
      done;
      
      /usr/bin/mc mb myminio/moki-images;
      /usr/bin/mc anonymous set public myminio/moki-images;
      /usr/bin/mc ls myminio/;
      exit 0;
      "


volumes:
  db-data:
  pgadmin-data:
  minio_data: