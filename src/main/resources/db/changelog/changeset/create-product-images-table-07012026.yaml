databaseChangeLog:
  - changeSet:
      id: create-product-images-table
      author: KyryloPyvovarov
      changes:
        - createTable:
            tableName: product_images
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: product_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_images_product
                    references: products(id)
              - column:
                  name: image_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: is_main
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: sort_order
                  type: INT
                  defaultValue: "0"
              - column:
                  name: alt_text
                  type: text