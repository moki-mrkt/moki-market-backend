databaseChangeLog:
  - changeSet:
      id: add-pg-trgm-extension-29012026
      author: moki
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: postgresql
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS pg_trgm;
            stripComments: true
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_product_name_trgm ON products USING GIN (name gin_trgm_ops);
            stripComments: true
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_product_description_trgm ON products USING GIN (description gin_trgm_ops);
            stripComments: true